<!doctype html>
<html lang="ko" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="책장">
<meta name="theme-color" content="#d9d0bb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex,nofollow">
<title>텍스트 책장</title>
<style>
:root{
  --ff-serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
  --ff-sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --fs:21px;--lh:1.75;--ff:var(--ff-serif);
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme=paper]{--paper:#f5eedc;--ink:#1b1710;--head:#b5471f;--bg:#d9d0bb;--ui:#fbf7ec;--uink:#2d2619;--mut:#8a7f69;--acc:#8c5a2b;--line:rgba(0,0,0,.12)}
html[data-theme=white]{--paper:#ffffff;--ink:#000000;--head:#d2552a;--bg:#d8d8dc;--ui:#ffffff;--uink:#141414;--mut:#7d7d85;--acc:#2f6fed;--line:rgba(0,0,0,.12)}
html[data-theme=sepia]{--paper:#efdfbd;--ink:#2e1f0c;--head:#9a3f12;--bg:#cdb98f;--ui:#f6ead0;--uink:#432f17;--mut:#8b7650;--acc:#a0521d;--line:rgba(0,0,0,.14)}
html[data-theme=dark]{--paper:#1e1f22;--ink:#e8e8ea;--head:#f0a56a;--bg:#0c0c0d;--ui:#2a2b2f;--uink:#e8e8ea;--mut:#8b8b92;--acc:#e0a560;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--uink);font-family:var(--ff-sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}

/* ===== 서재 (어두운 목록형) ===== */
body[data-view=lib]{background:#000;--bg:#000;--ui:#1c1c1e;--uink:#fff;--mut:#9a9aa0;--line:rgba(255,255,255,.15);--acc:#e0613a;--paper:#2a2a2d;--ink:#fff}
#lib{position:fixed;inset:0;overflow:auto;background:#000;color:#fff;padding:0 0 calc(var(--safe-b) + 150px);-webkit-overflow-scrolling:touch}
body[data-view=reader] #lib{display:none}
body[data-view=lib] #reader{display:none}
#banner{position:relative;height:min(34vh,300px);min-height:190px;background-size:cover;background-position:center;
  background:
   radial-gradient(ellipse 5% 12% at 52% 76%,#c65a3c 0 60%,transparent 62%),
   radial-gradient(ellipse 4% 8% at 63% 80%,#a8483a 0 60%,transparent 62%),
   radial-gradient(ellipse 60% 30% at 50% 100%,#8fc43c,transparent 70%),
   repeating-linear-gradient(90deg,#3d6b2b 0 38px,#527f33 38px 74px,#2f5a26 74px 120px),
   linear-gradient(#2b4a2e,#6a9a45)}
#banner.img{background-size:cover;background-position:center}
#banner::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.5),transparent 38%,rgba(0,0,0,.55))}
#banner>*{position:relative;z-index:1}
.bt{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-t) + 14px) 18px 0}
.bt h1{margin:0;font-size:1.45rem;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.bi button{font-size:1.25rem;padding:6px 10px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chip{display:inline-block;margin:14px 18px 0;padding:6px 14px;border-radius:16px;background:rgba(120,120,120,.6);backdrop-filter:blur(6px);font-size:.9rem}
.bl{position:absolute!important;left:18px;bottom:12px;font-size:1.25rem;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.bl small{font-size:.75rem;margin-left:2px}
#searchrow{padding:12px 18px 0}
#searchrow input{background:#1c1c1e;color:#fff;border-color:rgba(255,255,255,.2)}
.tools{display:flex;align-items:center;gap:6px;padding:14px 12px 6px;font-size:.9rem;color:#ddd}
.tools button,.tools label{padding:8px 10px;border-radius:8px;cursor:pointer;color:#ddd}
.tools .sp{flex:1}
.off{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:40px 26px;max-width:1100px;padding:26px 22px 0}
#grid.list{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:26px 30px;max-width:none}
.book{position:relative;cursor:pointer;min-width:0}
#grid.list .book{display:flex;gap:16px;align-items:flex-start;padding-right:30px}
.shelf{position:relative}
#grid.list .shelf{flex:none;width:76px}
#grid:not(.list) .shelf::after{content:"";position:absolute;left:-14px;right:-14px;bottom:-13px;height:15px;border-radius:2px;background:linear-gradient(#bb8c58,#8f6439 65%,#6c4a29);box-shadow:0 9px 12px rgba(0,0,0,.4);z-index:0}
.cover{position:relative;z-index:1;aspect-ratio:2/3;border-radius:2px 5px 5px 2px;overflow:hidden;background:#777;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.18) 45%,rgba(0,0,0,.06))}
.cover.gen{padding:12px 10px 12px 14px;color:#fff;display:flex;align-items:flex-end;font-weight:700;line-height:1.3;font-size:.85rem;word-break:keep-all}
#grid:not(.list) .cover.gen{padding:18px 16px 18px 24px;font-size:1.02rem}
.cover.gen span{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.bmeta{min-width:0;flex:1}
.bname{font-weight:600;font-size:.92rem;line-height:1.35;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#grid:not(.list) .bname{margin-top:24px;text-align:center}
#grid.list .bname{font-size:1.02rem;margin-top:2px}
.binfo{font-size:.8rem;color:var(--mut);margin-top:5px}
#grid:not(.list) .binfo{text-align:center}
.prow{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.78rem;color:#ccc}
#grid:not(.list) .prow{justify-content:center}
.pbar{width:100px;height:3px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:#fff}
.more{position:absolute;top:2px;right:0;z-index:3;width:30px;height:30px;color:#ddd;font-size:1.2rem;line-height:1}
#grid:not(.list) .more{top:6px;right:8px;background:rgba(0,0,0,.55);border-radius:50%;color:#fff;font-size:1.05rem}
.book.add .cover{background:transparent;border:2px dashed var(--mut);box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--mut);font-weight:600;font-size:.9rem}
.book.add .cover::before{display:none}
.book.add .plus{font-size:2.2rem;line-height:1}
.chk{position:absolute;top:8px;left:8px;z-index:4;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.book.sel .chk{background:var(--acc)}
.book.sel .chk::after{content:"✓"}
.book.sel .cover{outline:3px solid var(--acc);outline-offset:1px}
#selbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--ui);color:var(--uink);padding:12px 20px calc(var(--safe-b) + 12px);display:flex;gap:10px;align-items:center;box-shadow:0 -4px 18px rgba(0,0,0,.5)}
#selbar span{flex:1;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;font-size:.98rem;cursor:pointer}
.btn.ghost{background:var(--ui);color:var(--uink);border:1px solid var(--line)}
.mi{display:block;width:100%;text-align:left;padding:15px 4px;border-top:1px solid var(--line);font-size:1rem}
#empty{max-width:520px;color:var(--mut);line-height:1.7;padding:26px 22px 0}
#empty .btn{margin-top:14px}
#nowbar{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 56px);height:50px;background:#1c1c1e;display:flex;align-items:center;gap:14px;padding:0 18px;cursor:pointer;z-index:20;font-size:.85rem}
#nowbar img,#nowbar .nc{width:28px;height:40px;border-radius:2px;object-fit:cover;flex:none;background:#555}
#nowbar .nt{flex:1;min-width:0}
#nowbar .nt b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowbar .nt span{color:var(--mut);font-size:.78rem}
#nowbar .pbar{width:90px}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--safe-b) + 56px);padding-bottom:var(--safe-b);background:#0c0c0d;border-top:1px solid rgba(255,255,255,.1);display:flex;z-index:21}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;color:#9a9aa0}
#tabbar button i{font-style:normal;font-size:1.25rem;line-height:1}
#tabbar button.on{color:#fff}
#drop{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);color:#fff;display:none;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700}
#drop.on{display:flex}
.sortnote{font-size:.8rem}

/* ===== 읽기 화면 ===== */
#reader{position:fixed;inset:0}
#stage{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#book{position:relative;flex:none}
#book.single{overflow:hidden}
#book.spread{box-shadow:0 10px 40px rgba(0,0,0,.35)}
.slot{position:absolute;top:0;z-index:1}
.cast{position:absolute;top:0;z-index:2;pointer-events:none;opacity:0}
.leaf{position:absolute;top:0;z-index:3;transform-origin:0 50%;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.page{position:relative;background:var(--paper);color:var(--ink);overflow:hidden}
.vp{position:absolute;overflow:hidden}
.pdfp{display:flex;align-items:center;justify-content:center;background:#fff}
.inner{position:absolute;left:0;top:0;font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);column-gap:0;column-fill:auto;word-break:keep-all;overflow-wrap:break-word;text-align:justify;hyphens:none;color:var(--ink)}
body.left .inner{text-align:left}
.inner p{margin:0 0 .45em;text-indent:1em}
.inner h2{font-size:1.3em;text-align:center;margin:1.1em 0 1.1em;text-indent:0;line-height:1.4;font-weight:700;break-after:avoid;color:var(--head)}
.inner h2::before{content:"";display:block;width:28px;height:2px;margin:0 auto .7em;background:var(--head);opacity:.7}
.inner h3.sh{font-size:1.04em;font-weight:700;color:var(--head);text-indent:0;text-align:left;margin:1.05em 0 .45em;line-height:1.5;break-after:avoid}
.inner .sb{text-align:center;letter-spacing:.6em;color:var(--head);margin:.7em 0;text-indent:0}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.inner.flow{overflow:hidden}
.inner h2.volt{margin-top:calc(var(--ch,600px)*.3);font-size:1.75em}
.toc button.vol{font-weight:700;background:var(--line);border-radius:8px;padding-left:10px;margin-top:8px}
.inner.pg1>:first-child{margin-top:0}
.inner p.c{text-indent:0}
.inner p.t{text-align-last:justify}
body.left .inner p.t{text-align-last:auto}
body.crisp .inner{-webkit-text-stroke:.3px currentColor;text-rendering:optimizeLegibility}
body.crisp .inner h2,body.crisp .inner h3.sh{-webkit-text-stroke:.15px currentColor}
.head,.foot{position:absolute;left:0;right:0;text-align:center;font:11px var(--ff-sans);color:var(--mut);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 40px}
.head{top:20px}.foot{bottom:16px}
.cw{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.shw{position:absolute;top:0;height:100%;overflow:hidden;z-index:2;pointer-events:none}
.shw i{position:absolute;bottom:0;width:140px;display:block;transform-origin:0 100%;background:linear-gradient(to right,rgba(0,0,0,.42),rgba(0,0,0,.16) 38%,transparent)}
.cb{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.cb .page{box-shadow:-14px 0 20px rgba(0,0,0,.3)}
.cf{position:absolute;bottom:0;width:200px;display:block;transform-origin:100% 100%;background:linear-gradient(to left,rgba(0,0,0,.42) 0,rgba(0,0,0,.14) 14%,rgba(255,255,255,.26) 26%,transparent 64%)}
.bar{background:#111!important;color:#f2f2f2!important}
#bar-bot .cap{color:#aaa}
#measure{position:fixed;left:-99999px;top:0;visibility:hidden;pointer-events:none}

.bar{position:fixed;left:0;right:0;z-index:50;background:var(--ui);color:var(--uink);transition:transform .25s ease;box-shadow:0 0 18px rgba(0,0,0,.18)}
#bar-top{top:0;padding:calc(var(--safe-t) + 8px) 12px 8px;display:flex;align-items:center;gap:6px;transform:translateY(-115%)}
#bar-bot{bottom:0;padding:10px 20px calc(var(--safe-b) + 12px);transform:translateY(115%)}
body.chrome #bar-top,body.chrome #bar-bot{transform:none}
#bar-top .ttl{flex:1;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.ib{padding:9px 13px;border-radius:10px;font-weight:600;font-size:.95rem}
.ib:active{background:var(--line)}
#bar-bot .row{display:flex;align-items:center;gap:12px}
#bar-bot input[type=range]{flex:1;accent-color:var(--acc)}
#bar-bot .cap{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut);margin-bottom:6px}

.sheet{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.18)}
.sheet.open{display:flex;align-items:flex-end;justify-content:center}
.panel{width:min(600px,100%);max-height:78vh;overflow:auto;background:var(--ui);color:var(--uink);border-radius:18px 18px 0 0;padding:18px 20px calc(var(--safe-b) + 22px);box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.panel h3{margin:2px 0 14px;font-size:1.1rem}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set label{font-weight:600;font-size:.95rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 13px;font-size:.9rem}
.seg button.on{background:var(--acc);color:#fff}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:36px;border:1px solid var(--line);border-radius:10px;font-weight:700}
.stepper b{min-width:42px;text-align:center}
.themes{display:flex;gap:10px}
.themes button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line)}
.themes button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.note{font-size:.82rem;color:var(--mut);line-height:1.55;margin:10px 0 0}
.toc button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--line);gap:10px}
.toc button:first-child{border-top:0}
.toc button.cur{color:var(--acc);font-weight:700}
.toc small{color:var(--mut);white-space:nowrap}
textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
textarea{height:34vh;margin-top:8px;resize:none}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 40px);transform:translateX(-50%) translateY(20px);z-index:400;background:rgba(30,30,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-view="lib">

<!-- 서재 -->
<div id="lib">
  <div id="banner">
    <div class="bt"><h1>나의 책장</h1><div class="bi"><button id="b-search" aria-label="검색">🔍</button><button id="b-menu" aria-label="메뉴">☰</button></div></div>
    <span class="chip">기본 책장</span>
    <div class="bl">기본 책장<small id="bcount">(0)</small></div>
  </div>
  <div id="searchrow" hidden><input type="text" id="q" placeholder="책 이름 검색"></div>
  <div class="tools">
    <button id="btn-merge">합치기</button>
    <button id="btn-paste">붙여넣기</button>
    <label>추가<input id="file" class="off" type="file" accept="text/plain,.txt,.text,.md,.log,application/pdf,.pdf" multiple></label>
    <span class="sp"></span>
    <button id="sortbtn">이름순 ▾</button>
    <button id="viewbtn" aria-label="보기 방식">▦</button>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden>아직 책이 없어요.<br>아래 <b>추가</b>를 눌러 아이패드의 "파일" 앱에서 .txt 또는 PDF 파일을 고르세요. 한글이 깨지는 옛날 형식(EUC-KR)이나 줄이 중간에서 끊긴 파일도 자동으로 고쳐 줘요. 책은 이 기기 안에만 저장되고 어디에도 올라가지 않아요.<br><button class="btn" id="btn-sample">📖 사용 안내 책 넣기</button></div>
  <div id="nowbar" hidden></div>
  <nav id="tabbar">
    <button class="on" id="t-lib"><i>📚</i>책장</button>
    <button id="t-add"><i>＋</i>추가</button>
    <button id="t-merge"><i>⧉</i>합치기</button>
    <button id="t-set"><i>⚙</i>설정</button>
  </nav>
</div>
<div id="selbar" hidden><span id="selcount"></span><button class="btn ghost" id="sel-all">모두 선택</button><button class="btn" id="sel-ok">합치기</button><button class="btn ghost" id="sel-cancel">취소</button></div>
<input id="cover-file" class="off" type="file" accept="image/*">
<input id="banner-file" class="off" type="file" accept="image/*">
<div id="drop">여기에 놓으면 책이 추가돼요</div>

<!-- 읽기 -->
<div id="reader">
  <div id="stage"><div id="book"></div></div>
  <div id="measure"></div>
  <div class="bar" id="bar-top">
    <button class="ib" id="b-back">‹ 책장</button>
    <div class="ttl" id="b-title"></div>
    <button class="ib" id="b-toc">목차</button>
    <button class="ib" id="b-set">Aa</button>
  </div>
  <div class="bar" id="bar-bot">
    <div class="cap"><span id="b-chap"></span><span id="b-pct"></span></div>
    <div class="row"><button class="ib" id="b-prevc">◀︎</button><input type="range" id="b-slider" min="0" max="1000" value="0"><button class="ib" id="b-nextc">▶︎</button></div>
  </div>
</div>

<!-- 설정 -->
<div class="sheet" id="sh-set"><div class="panel" id="p-set"></div></div>
<div class="sheet" id="sh-toc"><div class="panel"><h3>목차</h3><div class="toc" id="toc"></div></div></div>
<div class="sheet" id="sh-paste"><div class="panel">
  <h3>글 붙여넣기</h3>
  <input type="text" id="paste-title" placeholder="책 제목">
  <textarea id="paste-text" placeholder="여기에 글을 붙여넣으세요"></textarea>
  <div class="actions" style="margin:14px 0 0"><button class="btn" id="paste-ok">책으로 만들기</button><button class="btn ghost" id="paste-cancel">취소</button></div>
</div></div>
<div class="sheet" id="sh-book"><div class="panel" id="p-book"></div></div>
<div id="toast"></div>

<script>
(()=>{'use strict';
/* ---------- 도우미 ---------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 저장소(IndexedDB) ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('txtbooks',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('books',{keyPath:'id'});r.result.createObjectStore('texts',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(store,mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
const dbPut=(s,v)=>tx(s,'readwrite',o=>o.put(v));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

/* ---------- 1) 글자 인코딩 알아내기 ---------- */
function decodeBuf(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)return{text:new TextDecoder('utf-8').decode(u8.subarray(3)),enc:'UTF-8'};
  if(u8[0]===0xFF&&u8[1]===0xFE)return{text:new TextDecoder('utf-16le').decode(u8.subarray(2)),enc:'UTF-16'};
  if(u8[0]===0xFE&&u8[1]===0xFF)return{text:new TextDecoder('utf-16be').decode(u8.subarray(2)),enc:'UTF-16'};
  try{return{text:new TextDecoder('utf-8',{fatal:true}).decode(u8),enc:'UTF-8'}}catch(e){}
  let ze=0,zo=0;const n=Math.min(u8.length,4000);
  for(let i=0;i<n;i++)if(u8[i]===0){if(i%2)zo++;else ze++}
  if(ze+zo>n*0.15)return{text:new TextDecoder(zo>ze?'utf-16le':'utf-16be').decode(u8),enc:'UTF-16'};
  let best=null;
  for(const[lab,name]of[['한글 옛 형식(EUC-KR)','euc-kr'],['일본어(Shift-JIS)','shift_jis'],['중국어(GBK)','gb18030'],['중국어(Big5)','big5']]){
    let t;try{t=new TextDecoder(name).decode(u8)}catch(e){continue}
    const bad=(t.match(/\uFFFD/g)||[]).length;
    if(!best||bad<best.bad)best={text:t,enc:lab,bad};
    if(bad===0&&name==='euc-kr')break;
  }
  return best||{text:new TextDecoder('utf-8').decode(u8),enc:'UTF-8'};
}

/* ---------- 2) 글 청소 ---------- */
function normalize(t){
  t=t.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n')
     .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'')
     .replace(/\u00A0/g,' ').replace(/[\u200B-\u200D\u2060]/g,'');
  t=t.split('\n').map(l=>l.replace(/[ \t\u3000]+$/,'')).join('\n');
  return t.replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- 3) 줄바꿈 정리 + 장 나누기 ---------- */
const SCENE=/^\s*([-=_~*#·.•○●◆◇■□▲△※☆★]\s*){3,}$/;
const CH_STRONG=[
  /^제\s*[0-9一二三四五六七八九十百千]+\s*[장화회부권편절막](?=\s|[.:：\-–—)\]]|$)/,
  /^(chapter|part|book)\s+[0-9ivxlc]+\b/i,
  /^(prologue|epilogue)\b/i,
  /^(프롤로그|에필로그|서장|서문|서막|후기|작가의\s*말|외전|번외편?|종장|마지막\s*화)(?=\s|[.:：\-–—)\]]|$)/,
  /^第\s*[0-9一二三四五六七八九十百千]+\s*[章回節卷話话]/,
  /^#{1,3}\s+\S/
];
const CH_WEAK=/^[0-9]{1,4}\s*[화장회편](?=\s|[.:：\-–—)\]]|$)/;
function isChapter(t){
  if(t.length>42)return false;
  if(CH_STRONG.some(r=>r.test(t)))return true;
  return CH_WEAK.test(t)&&!/[.?!。…"”다요]$/.test(t)&&t.length<=30;
}
const cleanTitle=t=>(t.replace(/^#{1,3}\s+/,'').replace(/^[=\-*·◆■□●○◇\s]+|[=\-*·◆■□●○◇\s]+$/g,'').trim()||t);
const CJK=/[\u3040-\u30ff\u3400-\u9fff\uff00-\uffef。、，．]/;
function joinLines(a,b){
  const x=a.slice(-1),y=b[0];
  if(CJK.test(x)&&CJK.test(y))return a+b;
  if(/-$/.test(a)&&/[a-z]/.test(y)&&/[a-z]/i.test(a.slice(-2,-1)))return a.slice(0,-1)+b;
  return a+' '+b;
}
const SUB_RE=/^(?:\d{1,2}[.)]\s*\S|[■◆●▶▷◎□◇○▲]\s*\S|[가-하][.)]\s*\S|[IVX]{1,4}\.\s*\S|\(\d{1,2}\)\s*\S|[一二三四五六七八九十]{1,3}[.、)]\s*\S)/;
function isSub(t){return t.length<=36&&SUB_RE.test(t)&&!/[.?!。…"”'’다요죠]$/.test(t)}
const CHUNK=50000;
function parse(text,mode){
  const lines=text.split('\n');
  const ne=lines.filter(l=>l.trim());
  const lens=ne.map(l=>l.trim().length).sort((a,b)=>a-b);
  const L=lens[Math.floor(lens.length*0.9)]||0;
  let wrapped=false;
  if(mode==='join')wrapped=true;
  else if(mode==='lines')wrapped=false;
  else if(L>=28){
    const near=ne.filter(l=>{const n=l.trim().length;return n>=L*0.85&&n<=L}).length;
    wrapped=near/Math.max(1,ne.length)>0.45;
  }
  const ind=ne.filter(l=>/^( {2,}|\t|\u3000)/.test(l)).length/Math.max(1,ne.length);
  const useIndent=ind>0.03&&ind<0.6;
  const out=[];let cur='',prevLen=0;
  const flush=()=>{if(cur){out.push({t:'p',v:cur});cur=''}};
  for(const raw of lines){
    const t=raw.trim().replace(/^\u3000+/,'');
    if(!t){if(wrapped)flush();continue}
    if(SCENE.test(t)){flush();out.push({t:'s'});continue}
    if(isChapter(t)){flush();out.push({t:'h',v:cleanTitle(t),vol:/^#\s+\S/.test(t)});continue}
    if(isSub(t)){flush();out.push({t:'b',v:t});continue}
    if(!wrapped){out.push({t:'p',v:t});continue}
    const indented=/^( {2,}|\t|\u3000)/.test(raw);
    if(cur){
      const endSent=/[.?!。…"”'’」』)]$/.test(cur);
      if((useIndent&&indented)||(endSent&&prevLen<L*0.75))flush();
    }
    cur=cur?joinLines(cur,t):t;prevLen=t.length;
  }
  flush();
  for(let i=0;i<out.length-1;i++){
    const a=out[i],b=out[i+1];
    if(a.t==='p'&&b.t==='h'&&a.v.length<=40&&!/[.?!。…"”'’다요죠\]]$/.test(a.v)&&!/^[\[「『"“(]/.test(a.v)){a.t='h';a.vol=true;a.v=cleanTitle(a.v)}
  }
  // 장 단위로 묶기
  let secs=[],c={title:'',chap:false,items:[]};
  for(const it of out){
    if(it.t==='h'){if(c.items.length||c.title)secs.push(c);c={title:it.v,chap:true,items:[],vol:!!it.vol}}
    else c.items.push(it);
  }
  secs.push(c);
  // 목차 줄만 있는 앞부분은 하나의 "차례" 글로
  let lead=0;
  while(lead<secs.length-1&&secs[lead].chap&&secs[lead].items.length===0&&!secs[lead].vol)lead++;
  if(lead>0){
    const toc={title:'차례',chap:true,items:secs.slice(0,lead).map(s=>({t:'p',v:s.title}))};
    secs=[toc,...secs.slice(lead)];
  }
  const chapters=secs.filter(s=>s.chap).length;
  // 너무 긴 장은 나눔
  const fin=[];
  for(const s of secs){
    const total=s.items.reduce((a,x)=>a+(x.v?x.v.length:3),0);
    if(total<=CHUNK){fin.push({title:s.title,toc:!!s.title,vol:!!s.vol,items:s.items});continue}
    let part=[],sum=0,first=true;
    const push=()=>{fin.push({title:first?s.title:'',toc:first&&!!s.title,vol:first&&!!s.vol,items:part});first=false;part=[];sum=0};
    for(const it of s.items){const n=it.v?it.v.length:3;if(sum+n>CHUNK&&part.length)push();part.push(it);sum+=n}
    if(part.length||first)push();
  }
  let totalChars=0;
  for(const s of fin){s.chars=s.items.reduce((a,x)=>a+(x.v?x.v.length:3),0)+(s.title?s.title.length:0);s.html=null;totalChars+=s.chars}
  return{secs:fin,total:Math.max(1,totalChars),stats:{wrapped,chapters,paras:out.filter(x=>x.t==='p').length}};
}
function secHTML(s){
  const sec=S.secs[s];
  if(sec.html)return sec.html;
  return sec.html=(sec.title?'<h2'+(sec.vol&&!sec.items.length?' class="volt"':'')+'>'+esc(sec.title)+'</h2>':'')+sec.items.map(i=>i.t==='s'?'<div class="sb">· · ·</div>':i.t==='b'?'<h3 class="sh">'+esc(i.v)+'</h3>':'<p>'+esc(i.v)+'</p>').join('');
}

/* ---------- 책장 화면 ---------- */
const fmtSize=n=>n>1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
let coverTarget=null;
function imgToDataURL(file,maxW){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const sc=Math.min(1,maxW/im.width),c=document.createElement('canvas');
      c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.88))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u;
  });
}

function sortMetas(ms){
  if(sortMode==='recent')ms.sort((a,b)=>(b.last||b.added)-(a.last||a.added));
  else if(sortMode==='added')ms.sort((a,b)=>a.added-b.added);
  else ms.sort(cmpMeta);
}

function cleanText(text){
  const r=parse(text,'auto'),out=[];
  for(const sc of r.secs){
    if(sc.title)out.push('## '+sc.title);
    for(const it of sc.items)out.push(it.t==='s'?'* * *':it.v);
  }
  return out.join('\n\n');
}
function commonTitle(ts){
  let p=ts[0];
  for(const t of ts){let i=0;while(i<p.length&&i<t.length&&p[i]===t[i])i++;p=p.slice(0,i)}
  p=p.replace(/[\s\-_.,()\[\]]+$/,'').replace(/\d+$/,'').replace(/[\s\-_.,()\[\]]+$/,'');
  return p.length>=2?p:ts[0];
}
async function mergeSelected(){
  const metas=(await dbAll('books')).filter(m=>sel.has(m.id)).sort(cmpMeta);
  if(metas.length<2){toast('2권 이상 골라 주세요');return}
  const bad=metas.find(m=>m.src==='pdf'&&!m.hasText);
  if(bad){toast('글자가 없는 스캔 PDF는 합칠 수 없어요: '+bad.title,4000);return}
  if(!confirm('이 순서로 한 권으로 합칠게요.\n\n'+metas.map((m,i)=>(i+1)+'. '+m.title).join('\n')+'\n\n계속할까요?'))return;
  const name=prompt('합친 책의 이름',commonTitle(metas.map(m=>m.title)));
  if(!name||!name.trim())return;
  toast('합치는 중…',60000);
  const parts=[];
  for(const m of metas){
    const t=await dbGet('texts',m.id);
    parts.push('# '+m.title+'\n\n'+cleanText(t.text||''));
  }
  const text=parts.join('\n\n');
  const r=parse(text,'lines');
  const cover=(metas.find(m=>m.cover)||{}).cover||null;
  const nm={id:uid(),title:name.trim(),size:metas.reduce((a,m)=>a+m.size,0),enc:'UTF-8',added:Date.now(),mode:'lines',chapters:r.stats.chapters,pct:0,pos:null,cover,coverCustom:false,merged:metas.length};
  await dbPut('books',nm);await dbPut('texts',{id:nm.id,text});
  let removed=false;
  if(confirm('“'+nm.title+'” 한 권으로 합쳤어요.\n\n원래 책 '+metas.length+'권은 서재에서 지울까요?\n(“취소”를 누르면 그대로 둡니다)')){
    for(const m of metas){await dbDel('books',m.id);await dbDel('texts',m.id)}removed=true;
  }
  exitSel();
  toast('합치기 완료'+(removed?'':' · 원래 책은 그대로 남겨 두었어요'),3500);
}

function loadPdfJs(){

    sc.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js';res()};

function stripRunning(pages){
  const lines=pages.map(p=>p.split('\n').map(l=>l.trim()));
  const norm=l=>l.replace(/\d+/g,'#').replace(/\s+/g,' ');
  const edgeOf=ls=>{const ne=ls.filter(Boolean);return new Set([...ne.slice(0,2),...ne.slice(-2)])};
  const cnt=new Map();
  lines.forEach(ls=>{new Set([...edgeOf(ls)].map(norm)).forEach(k=>cnt.set(k,(cnt.get(k)||0)+1))});
  const thr=Math.max(3,pages.length*0.3);
  return lines.map(ls=>{
    const edge=edgeOf(ls);
    return ls.filter(l=>{
      if(!l||!edge.has(l))return true;
      if(/^[-–—\s]*\d{1,4}[-–—\s]*$/.test(l))return false;
      return !(pages.length>=6&&cnt.get(norm(l))>=thr&&l.length<60);
    }).join('\n');
  });
}

  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise;
  return c.toDataURL('image/jpeg',.85);
}

function pageStarts(s){
  if(tabs.has(s))return tabs.get(s);
  const kids=kidsOf(s);
  measure.innerHTML='';
  const inner=el('div','inner');inner.style.cssText=innerStyle(0);
  inner.innerHTML=kids.map(kd=>kidHTML(kd,0,kd.v.length,false,false)).join('');
  measure.appendChild(inner);
  const W=M.cw,base=inner.getBoundingClientRect().left;
  const total=Math.max(1,Math.ceil((inner.scrollWidth-1)/W)),ch=inner.children;
  const txt=j=>{const k=kids[j];return(k.t==='p'||k.t==='b')&&ch[j].firstChild&&ch[j].firstChild.nodeType===3?ch[j].firstChild:null};
  const lf=(node,q)=>{rg.setStart(node,q);rg.setEnd(node,q+1);const r=rg.getClientRects();return r.length?r[0].left-base:null};
  const cl=(node,o)=>{const t=node.data,n=t.length;for(let q=o;q<n;q++){if(/\s/.test(t[q]))continue;const v=lf(node,q);if(v!==null)return v}return Infinity};

  const startL=j=>{const n=txt(j);return n?cl(n,0):ch[j].getBoundingClientRect().left-base};

function renderFlip(t){
  const f=F;f.t=t;
  const s=f.dir>0?t:1-t,X0=M.spread?M.pw:0,pw=M.pw,ph=M.ph;
  const phi=0.155*(1-s),sn=Math.sin(phi),cs=Math.cos(phi),tn=Math.tan(phi);
  const fb=X0+pw-s*pw,tx=fb+ph*tn;
  f.wf.style.clipPath='polygon('+r2(X0)+'px 0,'+r2(tx)+'px 0,'+r2(fb)+'px '+ph+'px,'+r2(X0)+'px '+ph+'px)';
  f.wb.style.clipPath='polygon(0 0,'+r2(tx)+'px 0,'+r2(fb)+'px '+ph+'px,0 '+ph+'px)';
  const ux=sn,uy=-cs,a=2*ux*ux-1,b=2*ux*uy,d=2*uy*uy-1;
  const eF=fb-a*fb-b*ph,fF=ph-b*fb-d*ph;
  f.cb.style.transform='matrix('+r5(-a)+','+r5(-b)+','+r5(b)+','+r5(d)+','+r2(a*2*X0+eF)+','+r2(b*2*X0+fF)+')';
  const H=Math.ceil(ph*1.3),op=Math.min(1,s*6)*Math.min(1,(1-s)*7);
  f.sr.style.cssText='left:'+r2(fb-X0)+'px;height:'+H+'px;transform:rotate('+r5(phi)+'rad);opacity:'+r2(op);
  f.cf.style.cssText='left:'+r2(fb-200)+'px;height:'+H+'px;transform:rotate('+r5(phi)+'rad);opacity:'+r2(op);
}
function endFlip(commit){
  const f=F;F=null;
  for(const e of[f.fe,f.be]){if(e){e.style.position='';e.style.left='';e.style.top=''}}
  if(f.dir>0){
    if(commit){if(M.spread)setSlot(slotL,f.be);stash(f.fe);S.pos=f.tgt}
    else{setSlot(slotR,f.fe);stash(f.be)}
  }else{
    if(commit){setSlot(slotR,f.fe);stash(f.be);S.pos=f.tgt}
    else{if(M.spread)setSlot(slotL,f.be);stash(f.fe)}
  }
  f.els.forEach(x=>x.remove());
  afterMove();
}
function runFlip(from,to){
  busy=true;
  const dur=Math.max(160,Math.abs(to-from)*560),t0=performance.now();
  const ease=from===0?(p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2):(p=>1-Math.pow(1-p,3));
  (function stp(now){
    const p=clamp((now-t0)/dur,0,1);
    renderFlip(from+(to-from)*ease(p));
    if(p<1)requestAnimationFrame(stp);else{busy=false;endFlip(to===1)}
  })(t0);
  // 첫 프레임은 즉시 그리지 않고 다음 프레임부터
}
function go(dir){
  if(busy||F)return;
  if(!startFlip(dir)){toast(dir>0?'마지막 쪽이에요':'첫 쪽이에요',1200);return}
  requestAnimationFrame(()=>runFlipFromStart());
}
function runFlipFromStart(){ if(!F)return; runFlip(0,1) }

/* 손가락 따라 넘기기 */
let drag=null;
stage.addEventListener('pointerdown',e=>{
  if(busy||F||document.querySelector('.sheet.open'))return;
  drag={x:e.clientX,y:e.clientY,t0:performance.now(),dir:0,dead:false,hist:[{x:e.clientX,t:performance.now()}]};
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
  if(!drag||drag.dead)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.dir){
    if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){
      const dir=dx<0?1:-1;
      if(!startFlip(dir)){drag.dead=true;toast(dir>0?'마지막 쪽이에요':'첫 쪽이에요',1200);return}
      drag.dir=dir;
    }
    return;
  }
  const t=clamp((drag.dir>0?-dx:dx)/(M.pw*1.15),0,1);
  renderFlip(t);
  drag.hist.push({x:e.clientX,t:performance.now()});if(drag.hist.length>6)drag.hist.shift();
});
function finishDrag(e,cancelled){
  if(!drag)return;const d=drag;drag=null;
  if(d.dead)return;
  if(!d.dir){
    if(cancelled)return;
    const dt=performance.now()-d.t0;
    if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<12&&dt<600){
      const fx=e.clientX/innerWidth;
      if(document.body.classList.contains('chrome')){setChrome(false);return}
      if(fx<0.28)go(-1);else if(fx>0.72)go(1);else setChrome(true);
    }
    return;
  }
  const h=d.hist,a=h[0],b=h[h.length-1],v=(b.x-a.x)/Math.max(1,b.t-a.t);
  const vd=d.dir>0?-v:v,t=F.t;
  const commit=t>0.4||(vd>0.4&&t>0.04);
  runFlip(t,commit?1:0);
}
stage.addEventListener('pointerup',e=>finishDrag(e,false));
stage.addEventListener('pointercancel',e=>finishDrag(e,true));
document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if($('body').dataset.view!=='reader')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')go(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
  else if(e.key==='Escape'){const o=document.querySelector('.sheet.open');if(o)o.classList.remove('open');else closeBook()}
});

/* 미리 만들어 두기 */
let pft;
function prefetch(){
  clearTimeout(pft);
  pft=setTimeout(()=>{
    if(F)return;
    const want=[];
    for(const p of[next(S.pos),prev(S.pos)]){
      if(!p)continue;want.push([p.s,p.k]);
      if(M.spread&&p.k+1<pageCount(p.s))want.push([p.s,p.k+1]);
    }
    let i=0;
    (function nx(){
      if(F||i>=want.length)return;
      const[s,k]=want[i++],key=s+':'+k;
      const inSlot=(slotL.firstChild&&slotL.firstChild._k===key)||(slotR.firstChild&&slotR.firstChild._k===key);
      if(!cache.has(key)&&!inSlot){cache.set(key,buildPage(s,k));trimCache()}
      setTimeout(nx,30);
    })();
  },140);
}

/* ---------- 진행·저장 ---------- */
function progress(){const{s,k}=S.pos;return clamp((S.cum[s]+(k/pageCount(s))*S.secs[s].chars)/S.total,0,1)}
function chapName(s){if(S.pdf)return 'PDF 원본 쪽';for(let i=s;i>=0;i--)if(S.secs[i].title)return S.secs[i].title;return ''}
function updateUI(){
  const f=progress();
  $('#b-slider').value=Math.round(f*1000);
  $('#b-pct').textContent=Math.round(f*100)+'%  ·  '+(S.pos.k+1)+'/'+pageCount(S.pos.s)+'쪽';
  $('#b-chap').textContent=chapName(S.pos.s);
}
let saveT;
function savePos(){
  const{s,k}=S.pos;
  S.meta.pos={s,frac:k/pageCount(s)};S.meta.pct=progress();S.meta.last=Date.now();
  clearTimeout(saveT);saveT=setTimeout(()=>dbPut('books',S.meta),400);
}
function afterMove(){updateUI();savePos();prefetch()}
function relayout(s,frac){
  counts.clear();cache.clear();slotL.textContent='';slotR.textContent='';metrics();sizeBook();
  s=clamp(s,0,S.secs.length-1);
  const n=pageCount(s);let k=clamp(Math.floor(frac*n+1e-6),0,n-1);
  if(M.spread)k-=k%2;
  if(!M.spread)slotL.textContent='';
  S.pos={s,k};showPos(S.pos);updateUI();prefetch();
}
function currentFrac(){return{s:S.pos.s,frac:counts.has(S.pos.s)?S.pos.k/counts.get(S.pos.s):0}}
function jumpFrac(f){
  const x=clamp(f,0,1)*S.total;let s=S.secs.length-1;
  for(let i=0;i<S.secs.length;i++)if(x<S.cum[i]+S.secs[i].chars){s=i;break}
  const within=S.secs[s].chars?(x-S.cum[s])/S.secs[s].chars:0;
  const n=pageCount(s);let k=clamp(Math.floor(within*n),0,n-1);if(M.spread)k-=k%2;
  S.pos={s,k};showPos(S.pos);afterMove();
}
function jumpSec(s){S.pos={s:clamp(s,0,S.secs.length-1),k:0};showPos(S.pos);afterMove()}
function reparse(){
  if(S.pdf){const n=S.pdf.n;S.secs=[{title:'',toc:false,items:[],chars:n,html:''}];S.total=n;S.cum=[0];S.stats={wrapped:false,chapters:0,paras:0};return}
  const r=parse(S.text,S.meta.mode||'auto');
  S.secs=r.secs;S.total=r.total;S.stats=r.stats;
  S.cum=[];let c=0;for(const s of S.secs){S.cum.push(c);c+=s.chars}
}

/* ---------- 책 열고 닫기 ---------- */
async function openBook(id,startFrac){
  const meta=await dbGet('books',id),t=await dbGet('texts',id);
  if(!meta||!t){toast('책을 열 수 없어요');return}
  if(S.pdf){try{S.pdf.doc.destroy()}catch(e){}S.pdf=null}
  if(meta.src==='pdf'&&(meta.view==='page'||!meta.hasText)){
    try{
      toast('PDF를 여는 중…',1500);
      await loadPdfJs();
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(t.pdf.slice(0))}).promise;
      S.pdf={doc,n:doc.numPages};
    }catch(e){toast('PDF를 열 수 없어요');return}
  }
  S.meta=meta;S.text=t.text||'';reparse();
  document.body.dataset.view='reader';
  $('#b-title').textContent=meta.title;
  applySet();
  const p=startFrac!=null?{s:0,frac:0}:(meta.pos||{s:0,frac:0});
  relayout(p.s,p.frac);
  if(startFrac!=null)jumpFrac(startFrac);
  setChrome(false);
}
async function closeBook(){
  clearTimeout(saveT);
  if(S.meta)await dbPut('books',S.meta);
  setChrome(false);
  document.body.dataset.view='lib';
  book.querySelectorAll('.cw,.shw').forEach(x=>x.remove());F=null;busy=false;
  slotL.textContent='';slotR.textContent='';cache.clear();counts.clear();
  if(S.pdf){try{S.pdf.doc.destroy()}catch(e){}S.pdf=null}
  S.meta=null;renderLib();
}
function setChrome(on){document.body.classList.toggle('chrome',on)}
$('#b-back').onclick=closeBook;
$('#b-prevc').onclick=()=>{if(S.pdf){jumpFrac(Math.max(0,progress()-10/S.pdf.n));return}const s=S.pos.s;if(S.pos.k>0)jumpSec(s);else{let i=s-1;while(i>0&&!S.secs[i].toc)i--;jumpSec(Math.max(0,i))}};
$('#b-nextc').onclick=()=>{if(S.pdf){jumpFrac(Math.min(1,progress()+10/S.pdf.n));return}let i=S.pos.s+1;while(i<S.secs.length&&!S.secs[i].toc)i++;if(i<S.secs.length)jumpSec(i);else toast('마지막 장이에요',1200)};
$('#b-slider').oninput=e=>{$('#b-pct').textContent=Math.round(e.target.value/10)+'%'};
$('#b-slider').onchange=e=>jumpFrac(e.target.value/1000);

/* 목차 */
$('#b-toc').onclick=()=>{
  const box=$('#toc');box.innerHTML='';
  let any=false;
  S.secs.forEach((s,i)=>{
    if(!s.toc)return;any=true;
    const b=el('button',((i===S.pos.s||(i<S.pos.s&&!S.secs.slice(i+1,S.pos.s+1).some(x=>x.toc)))?'cur':'')+(s.vol?' vol':''));
    b.innerHTML='<span>'+esc(s.title)+'</span><small>'+Math.round(S.cum[i]/S.total*100)+'%</small>';
    b.onclick=()=>{$('#sh-toc').classList.remove('open');jumpSec(i)};
    box.appendChild(b);
  });
  if(!any)box.innerHTML='<p class="note">이 파일에서는 장 제목을 찾지 못했어요. 아래쪽 막대로 원하는 위치로 이동하세요.</p>';
  $('#sh-toc').classList.add('open');
  const cur=box.querySelector('.cur');if(cur)cur.scrollIntoView({block:'center'});
};
$('#sh-toc').onclick=e=>{if(e.target.id==='sh-toc')e.target.classList.remove('open')};

/* 설정 */
function seg(opts,val,cb){
  const d=el('div','seg');
  for(const[v,l]of opts){const b=el('button',v===val?'on':'',l);b.onclick=()=>{cb(v);buildSettings()};d.appendChild(b)}
  return d;
}
function row(label,ctrl){const r=el('div','set');r.appendChild(el('label','',label));r.appendChild(ctrl);return r}
function change(fn){
  const c=currentFrac(),f=progress();
  fn();applySet();
  relayout(c.s,c.frac);
}
function themeRow(p){
  const th=el('div','themes');
  for(const[k,c]of[['paper','#f5eedc'],['white','#ffffff'],['sepia','#efdfbd'],['dark','#1e1f22']]){
    const b=el('button',S.set.theme===k?'on':'');b.style.background=c;b.setAttribute('aria-label',k);
    b.onclick=()=>{S.set.theme=k;applySet();buildSettings()};th.appendChild(b);
  }
  p.appendChild(row('배경',th));
}
function buildSettings(){
  const p=$('#p-set');p.innerHTML='<h3>읽기 설정</h3>';
  if(S.meta.src==='pdf'&&S.meta.hasText){
    p.appendChild(row('보기 방식',seg([['text','글자로 변환'],['page','원본 쪽 그대로']],S.pdf?'page':'text',v=>{
      if((v==='page')===!!S.pdf)return;
      const f=progress();S.meta.view=v;
      dbPut('books',S.meta).then(()=>{$('#sh-set').classList.remove('open');openBook(S.meta.id,f)});
    })));
  }
  if(S.pdf){
    themeRow(p);
    p.appendChild(el('p','note','PDF 원본의 쪽 모양 그대로 보여 줘요. 이 방식에서는 글자 크기를 바꿀 수 없어요.'+(S.meta.hasText?' “글자로 변환”을 고르면 글자 크기와 글꼴을 바꿀 수 있어요.':'')));
    return;
  }
  const st=el('div','stepper');
  const minus=el('button','','A−'),plus=el('button','','A＋'),val=el('b','',S.set.fs);
  minus.onclick=()=>{change(()=>S.set.fs=Math.max(13,S.set.fs-1));buildSettings()};
  plus.onclick=()=>{change(()=>S.set.fs=Math.min(40,S.set.fs+1));buildSettings()};
  st.append(minus,val,plus);p.appendChild(row('글자 크기',st));
  p.appendChild(row('글꼴',seg([['serif','명조'],['sans','고딕']],S.set.ff,v=>change(()=>S.set.ff=v))));
  p.appendChild(row('줄 간격',seg([[1.55,'좁게'],[1.75,'보통'],[2,'넓게']],S.set.lh,v=>change(()=>S.set.lh=v))));
  p.appendChild(row('글 정렬',seg([[true,'양쪽 맞춤'],[false,'왼쪽']],S.set.just,v=>change(()=>S.set.just=v))));
  p.appendChild(row('글자 선명하게',seg([[true,'켜기'],[false,'끄기']],S.set.crisp!==false,v=>change(()=>S.set.crisp=v))));
  themeRow(p);
  p.appendChild(row('줄 정리 방식 (이 책)',seg([['auto','자동'],['join','문단으로 합치기'],['lines','줄 그대로']],S.meta.mode||'auto',v=>{
    const f=progress();S.meta.mode=v;reparse();dbPut('books',S.meta);
    relayout(0,0);jumpFrac(f);
  })));
  const info=S.meta.enc+' 형식으로 읽음'+(S.stats.wrapped?' · 끊긴 줄을 문단으로 이어 붙임':'')+' · 장 '+S.stats.chapters+'개 · 문단 '+S.stats.paras+'개';
  p.appendChild(el('p','note','이 파일: '+esc(info)+'<br>글이 이상하게 이어 붙었으면 “줄 그대로”, 줄이 너무 많이 끊겨 있으면 “문단으로 합치기”를 눌러 보세요.'));
}
$('#b-set').onclick=()=>{buildSettings();$('#sh-set').classList.add('open')};
$('#sh-set').onclick=e=>{if(e.target.id==='sh-set')e.target.classList.remove('open')};

/* 창 크기·회전 */
let rsT,lastW=innerWidth,lastH=innerHeight;
addEventListener('resize',()=>{
  clearTimeout(rsT);
  rsT=setTimeout(()=>{
    if(document.body.dataset.view!=='reader'||!S.meta)return;
    if(innerWidth===lastW&&innerHeight===lastH)return;
    lastW=innerWidth;lastH=innerHeight;
    if(F){F.els.forEach(x=>x.remove());F=null;busy=false}
    const c=currentFrac();relayout(c.s,c.frac);
  },220);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.meta)dbPut('books',S.meta)});

window.__tb={S,M:()=>M,pageStarts,pageCount,buildPage,kidsOf,measure};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
applySet();renderLib();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
